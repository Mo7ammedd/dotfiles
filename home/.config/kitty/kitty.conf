# Wallpaper colours, generated by Matugen
include ~/.config/kitty/themes/matugen.conf

# Typography
font_family JetBrainsMono Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.0
modify_font cell_height 105%

# Background and spacing
background_opacity 0.94
dynamic_background_opacity yes
window_padding_width 10 12

# Compact tabs, visible when more than one tab is open
tab_bar_edge top
tab_bar_min_tabs 2
tab_bar_style separator
tab_bar_align left
tab_bar_margin_width 12
tab_bar_margin_height 4 0
tab_separator "  │  "
tab_title_max_length 32
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{secure_input_symbol}{fmt.fg.tab}{index}  {tab.last_focused_progress_percent}{title}"
active_tab_font_style bold
inactive_tab_font_style normal

# Cursor
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.6
cursor_trail 0

# Shell behaviour
shell /usr/bin/zsh
confirm_os_window_close 0
